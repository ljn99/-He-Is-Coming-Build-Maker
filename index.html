<!DOCTYPE html>
<html>
<head>
  <title>HIC Build Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="build-area">
        <div class="weapon-slot">

        </div>
        
        <div class="weapon-oils">

            <div class="oil-toggle" data-stat="attack">ATK</div>
            <div class="oil-toggle" data-stat="armor">ARM</div>
            <div class="oil-toggle" data-stat="speed">SPD</div>
        
        </div>

        <div class="item-slots">
            <div class="item-slot item-slot-build"></div>
            <div class="item-slot item-slot-build"></div>
            <div class="item-slot item-slot-build"></div>
            <div class="item-slot item-slot-build"></div>
        </div>

        <div class="build-stats">
            <div class="health"></div>
            <div class="attack"></div>
            <div class="armor"></div>
            <div class="speed"></div>
        </div>

    </div>

    <div class="item-picker">

        <div class="item-grid">

        </div>

        <div class="item-filter">

        </div>

    </div>

    <div class="tooltip" id="tooltip"></div>
    <script src="script.js"></script>
</body>
</html>
